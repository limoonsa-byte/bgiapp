name: Import OpenClaw Office upstream

on:
  push:
    branches:
      - oro-ai-office-original

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream OpenClaw Office
        run: |
          git clone --depth 1 https://github.com/WW-AI-Lab/openclaw-office.git /tmp/openclaw-office

      - name: Replace branch contents with upstream project
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/openclaw-office/ ./

      - name: Commit full upstream source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github'
          git commit -m 'chore: import full WW-AI-Lab/openclaw-office upstream' || true
          git push origin HEAD:oro-ai-office-original
