name: Verify ORO AI Office RPG

on:
  push:
    branches:
      - oro-ai-office-rpg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit hardcoded Chinese
        shell: bash
        run: |
          echo '=== hardcoded Chinese outside zh locale ==='
          grep -RInP '[\x{4e00}-\x{9fff}]' src \
            --exclude-dir=locales/zh \
            --exclude='*.test.ts' \
            --exclude='*.test.tsx' \
            || true
          echo '=== end audit ==='
          exit 1
