name: Verify ORO AI Office RPG

on:
  push:
    branches:
      - oro-ai-office-rpg
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: oro-ai-office-rpg-dist
          path: dist
          if-no-files-found: error
