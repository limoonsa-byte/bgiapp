name: Verify ORO AI Office RPG

on:
  push:
    branches:
      - oro-ai-office-rpg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build live OpenClaw version
        run: VITE_MOCK=false npm run build

      - name: Upload live build
        uses: actions/upload-artifact@v4
        with:
          name: oro-ai-office-rpg-live-dist
          path: dist
          if-no-files-found: error

      - name: Publish live static branch
        shell: bash
        run: |
          set -euo pipefail
          cp -a dist /tmp/oro-ai-office-rpg-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan oro-ai-office-rpg-dist
          git rm -rf .
          git clean -fdx
          cp -a /tmp/oro-ai-office-rpg-dist/. .
          touch .nojekyll
          git add -A
          git commit -m "live: ORO AI Office with OpenClaw Gateway enabled"
          git push --force origin HEAD:oro-ai-office-rpg-dist
