name: Verify ORO AI Office RPG

on:
  push:
    branches:
      - oro-ai-office-rpg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Translate remaining workbench runtime prompts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/store/console-stores/skill-workbench-store.ts')
          text = p.read_text()
          replacements = {
            '[默认 Skill：${skillSlug}/SKILL.md]': '[기본 Skill: ${skillSlug}/SKILL.md]',
            '使用Skill「skill-workbench-mermaid-guard」为 skill ${skillSlug} 生成或更新工作流程图，写入 ${skillDir}/FLOWCHART.md。直接执行，不要先解释。': 'Skill「skill-workbench-mermaid-guard」를 사용해 skill ${skillSlug}의 작업 흐름도를 생성하거나 업데이트하고 ${skillDir}/FLOWCHART.md에 저장하세요. 먼저 설명하지 말고 바로 실행하세요.',
            '使用Skill「skill-workbench-mermaid-guard」为 skill ${skillSlug} 生成或更新 A2UI 首次交互输入表单，写入 ${skillDir}/ui.json，并幂等注入 SKILL.md 使用提示。直接执行，不要先解释。': 'Skill「skill-workbench-mermaid-guard」를 사용해 skill ${skillSlug}의 A2UI 최초 입력 양식을 생성하거나 업데이트하고 ${skillDir}/ui.json에 저장하세요. SKILL.md 사용 안내도 중복 없이 반영하세요. 먼저 설명하지 말고 바로 실행하세요.',
            '[系统：本次对话请遵循 Skills 工作台默认技能执行任务]': '[시스템: 이번 대화에서는 Skills 작업대의 기본 스킬 지침에 따라 작업하세요]',
            '[系统：当前正在${mode === "browse" ? "浏览并修改" : "修改"} skill ${currentSkillSlug}]': '[시스템: 현재 skill ${currentSkillSlug}을(를) ${mode === "browse" ? "검토 및 수정" : "수정"} 중입니다]',
            '目标目录：${skillDir}': '대상 디렉터리: ${skillDir}',
            '【严格范围限制 - 违反视为错误】': '【엄격한 작업 범위 제한 - 위반 시 오류로 간주】',
            '1. 仅允许读写 ${skillDir}/ 目录下的文件（SKILL.md / FLOWCHART.md / ui.json / _meta.json / scripts/ / references/ / tests/ 等）。': '1. ${skillDir}/ 디렉터리 아래 파일만 읽고 쓸 수 있습니다 (SKILL.md / FLOWCHART.md / ui.json / _meta.json / scripts/ / references/ / tests/ 등).',
            '2. 禁止修改任何其他 skill 目录、全局配置文件（如 ~/.openclaw/config.* 、~/.openclaw/agents/* 、~/.openclaw/settings/*）以及 ~/.openclaw/workspace/skills/ 之外的任何路径。': '2. 다른 skill 디렉터리, 전역 설정 파일(예: ~/.openclaw/config.* , ~/.openclaw/agents/* , ~/.openclaw/settings/*), 그리고 ~/.openclaw/workspace/skills/ 밖의 경로는 수정할 수 없습니다.',
            '3. 禁止创建/删除/重命名其他 skill；禁止修改本 skill 的 slug 与目录名。': '3. 다른 skill을 생성/삭제/이름변경할 수 없으며, 현재 skill의 slug와 디렉터리명도 변경할 수 없습니다.',
            '4. 执行任何 read / write / edit / shell 之前，必须先确认目标路径以 " + skillDir + "/ 开头；若用户请求超出该范围，请拒绝并提示“仅在技能工作台中修改当前 skill”。': '4. read / write / edit / shell 실행 전 대상 경로가 " + skillDir + "/ 로 시작하는지 반드시 확인하세요. 범위를 벗어난 요청은 거절하고 “스킬 작업대에서는 현재 skill만 수정할 수 있습니다”라고 안내하세요.',
            '5. 流程图结构调整 → FLOWCHART.md；技能说明/行为 → SKILL.md；A2UI 表单 → ui.json；必要时多个同时修改。': '5. 흐름도 구조 변경 → FLOWCHART.md, 스킬 설명/동작 → SKILL.md, A2UI 양식 → ui.json을 수정하세요. 필요하면 여러 파일을 함께 수정할 수 있습니다.',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text)
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/store/console-stores/skill-workbench-store.ts
            git commit -m "fix(i18n): translate skill workbench runtime prompts"
            git push origin HEAD:oro-ai-office-rpg
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build mock preview
        run: VITE_MOCK=true npm run build

      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: oro-ai-office-rpg-dist
          path: dist
          if-no-files-found: error

      - name: Publish static preview branch
        shell: bash
        run: |
          set -euo pipefail
          cp -a dist /tmp/oro-ai-office-rpg-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan oro-ai-office-rpg-dist
          git rm -rf .
          git clean -fdx
          cp -a /tmp/oro-ai-office-rpg-dist/. .
          touch .nojekyll
          git add -A
          git commit -m "preview: ORO AI Office RPG Korean mobile build"
          git push --force origin HEAD:oro-ai-office-rpg-dist
