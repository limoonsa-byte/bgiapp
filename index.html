<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ORO Drawing Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e14;color:#eef2f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}button{font:inherit;color:inherit}.hide{display:none!important}.home,.editor{height:100dvh}.home{padding:18px 14px;background:linear-gradient(#0b0e14,#121827);overflow:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-weight:900;letter-spacing:.08em}.logo b{color:#9b86ff}.btn{border:1px solid #303a4d;background:#171c26;border-radius:10px;padding:8px 11px}.primary{background:#7358f6;border-color:#7358f6;font-weight:800}.label{font-size:12px;color:#8995a8;letter-spacing:.12em;margin-bottom:10px}.card{border:1px solid #2c3548;background:#141922;border-radius:16px;overflow:hidden}.thumb{height:220px;background:#0d1118;padding:24px}.meta{padding:14px}.meta strong{display:block;margin-bottom:5px}.meta span{font-size:12px;color:#8995a8}.editor{display:flex;flex-direction:column}.top{height:52px;background:#11151c;border-bottom:1px solid #293245;display:flex;align-items:center;gap:6px;padding:0 8px}.title{flex:1;font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .btn{font-size:12px;padding:7px 9px}.stage{position:relative;flex:1;background:#0d1118;overflow:hidden}.grid{position:absolute;inset:0;background-image:linear-gradient(#161d29 1px,transparent 1px),linear-gradient(90deg,#161d29 1px,transparent 1px);background-size:25px 25px}.drawing{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.wall{stroke:#edf1f7;stroke-width:5;stroke-linecap:square}.new{stroke:#69d0ff}.demo{stroke:#ff7979}.dim{font:11px system-ui;fill:#aeb9ca;text-anchor:middle}.tools{height:68px;background:#10141b;border-top:1px solid #293245;display:flex;padding:5px 6px;gap:4px}.tool{flex:1;border:1px solid transparent;background:transparent;color:#aeb7c7;border-radius:10px;font-size:11px}.tool b{display:block;font-size:16px;margin-bottom:2px}.tool.on{background:#251f44;border-color:#6653d4;color:#fff}.badge{position:absolute;top:8px;right:8px;background:#211c3e;border:1px solid #5e4cc4;border-radius:999px;padding:5px 7px;font-size:10px}.viewerMark{position:absolute;top:8px;left:8px;background:#101725;border:1px solid #34425a;border-radius:9px;padding:6px 8px;font-size:11px;display:none}.editor.viewer .viewerMark{display:block}.editor.viewer .tools{display:none}.tip{position:absolute;left:10px;right:10px;bottom:78px;background:#111823e8;border:1px solid #344056;border-radius:12px;padding:9px 11px;font-size:12px;color:#b7c1d0}.editor.viewer .tip{display:none}.toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:#141b25;border:1px solid #3a465c;border-radius:10px;padding:9px 12px;font-size:12px;z-index:10}</style></head><body><section id="home" class="home"><div class="head"><div><div class="logo">ORO <b>DRAWING</b></div><div style="font-size:12px;color:#8290a4;margin-top:4px">모바일 맛보기</div></div><button id="new" class="btn primary">+ 새 도면</button></div><div class="label">최근 도면</div><div id="open" class="card"><div class="thumb"><svg viewBox="0 0 420 300" width="100%" height="100%"><path d="M35 35H385V265H35Z" fill="none" stroke="#e9edf5" stroke-width="6"/><path d="M210 35V265" stroke="#69d0ff" stroke-width="6"/><path d="M35 150H210" stroke="#ff7979" stroke-width="6"/><text x="210" y="22" class="dim">4200</text><text x="402" y="155" class="dim" transform="rotate(90 402 155)">3200</text></svg></div><div class="meta"><strong>모바일 맛보기 도면</strong><span>벽 · 자동치수 · 저장/닫기 · Viewer</span></div></div></section><section id="editor" class="editor hide"><div class="top"><div id="title" class="title">모바일 맛보기 도면</div><button id="save" class="btn">저장</button><button id="view" class="btn">뷰어</button><button id="close" class="btn">닫기</button></div><div id="stage" class="stage"><div class="grid"></div><svg id="svg" class="drawing"></svg><div class="viewerMark">읽기 전용 Viewer</div><div class="badge">SNAP · ORTHO</div><div id="tip" class="tip">벽 모드: 화면을 두 번 탭하면 벽이 생깁니다. 자동치수도 켜고 끌 수 있습니다.</div></div><div class="tools"><button class="tool on" data-t="select"><b>V</b>선택</button><button class="tool" data-t="wall"><b>W</b>벽</button><button class="tool" data-t="pan"><b>H</b>이동</button><button id="dimBtn" class="tool on"><b>⚡</b>자동치수</button></div></section><div id="toast" class="toast hide"></div><script>const $=s=>document.querySelector(s);let walls=JSON.parse(localStorage.getItem('oroWalls')||'null')||[[40,70,330,70,'old'],[330,70,330,330,'new'],[330,330,40,330,'old'],[40,330,40,70,'demo']];let mode='select',first=null,dims=true,viewer=false;function note(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),900)}function render(){let s='';walls.forEach((w,i)=>{let c=w[4]==='new'?'new':w[4]==='demo'?'demo':'';s+=`<line class="wall ${c}" x1="${w[0]}" y1="${w[1]}" x2="${w[2]}" y2="${w[3]}"/>`;if(dims){let l=Math.round(Math.hypot(w[2]-w[0],w[3]-w[1])*12);s+=`<text class="dim" x="${(w[0]+w[2])/2}" y="${(w[1]+w[3])/2-9}">${l}</text>`}});if(first)s+=`<circle cx="${first[0]}" cy="${first[1]}" r="6" fill="#a493ff"/>`;$('#svg').innerHTML=s}function openEditor(){home.classList.add('hide');editor.classList.remove('hide');render()}function homeScreen(){editor.classList.add('hide');home.classList.remove('hide')}$('#open').onclick=openEditor;$('#new').onclick=()=>{walls=[];localStorage.setItem('oroWalls','[]');openEditor();note('새 도면을 만들었습니다')};$('#save').onclick=()=>{localStorage.setItem('oroWalls',JSON.stringify(walls));note('저장했습니다')};$('#close').onclick=()=>{localStorage.setItem('oroWalls',JSON.stringify(walls));homeScreen()};$('#view').onclick=()=>{viewer=!viewer;editor.classList.toggle('viewer',viewer);$('#view').textContent=viewer?'편집':'뷰어';first=null;render()};document.querySelectorAll('.tool[data-t]').forEach(b=>b.onclick=()=>{mode=b.dataset.t;first=null;document.querySelectorAll('.tool[data-t]').forEach(x=>x.classList.toggle('on',x===b));render()});$('#dimBtn').onclick=()=>{dims=!dims;$('#dimBtn').classList.toggle('on',dims);render();note(dims?'자동치수 ON':'자동치수 OFF')};$('#svg').addEventListener('pointerup',e=>{if(viewer||mode!=='wall')return;let r=$('#svg').getBoundingClientRect(),x=Math.round((e.clientX-r.left)/r.width*370/10)*10+20,y=Math.round((e.clientY-r.top)/r.height*370/10)*10+20;if(!first){first=[x,y];render();return}let dx=Math.abs(x-first[0]),dy=Math.abs(y-first[1]);if(dx>dy)y=first[1];else x=first[0];walls.push([first[0],first[1],x,y,'old']);first=[x,y];render()});render();</script></body></html>
